<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ingen anslutning — Körjournal</title>
<style>
  :root { color-scheme: light dark; }
  body {
    margin: 0; min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    padding: 24px calc(24px + env(safe-area-inset-right)) 24px calc(24px + env(safe-area-inset-left));
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #f8fafc; color: #1e293b; text-align: center;
  }
  .box { max-width: 26rem; }
  img { width: 72px; height: 72px; border-radius: 16px; margin-bottom: 20px; }
  h1 { font-size: 20px; margin: 0 0 8px; }
  p { margin: 0 0 20px; color: #64748b; }
  button {
    font: inherit; font-weight: 600; color: #fff; background: #2563eb;
    border: 0; border-radius: 10px; padding: 12px 20px; cursor: pointer;
  }
  @media (prefers-color-scheme: dark) {
    body { background: #0f172a; color: #e2e8f0; }
    p { color: #94a3b8; }
  }
</style>
</head>
<body>
  <div class="box">
    <img src="/icons/icon-192.png" alt="">
    <h1>Ingen anslutning</h1>
    <p>Körjournalen behöver nätet för att hämta och spara resor. Resan du håller på med finns kvar på servern — inget har gått förlorat.</p>
    <button onclick="location.reload()">Försök igen</button>
  </div>
</body>
</html>
